[main]
# ---------------
# HTML DOWNLOADER
# ---------------

# Digunakan crawler.py. Jika tidak ditetapkan maka akan dibuat direktori "tmp"
# di home.
;base_download_dir = /home/sugiana/tmp

# Digunakan downloader.py berisi daftar tautan produk sesuai kategori. Jika di
# antaranya memuat produk lain seperti plastik bubble atau kotak kayu maka akan
# ditetapkan oleh AI sebagai kategori "lainnya". Jadi tidak masalah tercampur.
url =
    https://www.tokopedia.com/oppo/product
    https://www.tokopedia.com/samsung-official-store/etalase/mobiles
    https://www.tokopedia.com/itel-authorized-shop/product
    https://www.tokopedia.com/officialinfinix/product
    https://www.tokopedia.com/tecnoofficialstore/product
    https://www.tokopedia.com/xiaomi/etalase/mobile
    https://www.tokopedia.com/realmeofficialpartner/product
    https://www.tokopedia.com/vivo/product
    https://www.tokopedia.com/asus-mobile-indonesia
    https://www.tokopedia.com/huawei/etalase/smartphone
    https://www.tokopedia.com/nokia-mobile/product
    https://www.tokopedia.com/nerdbossgadget/product
    https://www.tokopedia.com/sharp-mobile/etalase/smartphone
    https://www.tokopedia.com/advanstore/etalase/handphone
    https://www.tokopedia.com/tecnoofficialstore/product
    https://www.tokopedia.com/motorola-indonesia/product


# ------------
# AKAL IMITASI
# ------------

# - Prompt -

# Digunakan to_category.py untuk menetapkan prompt_template di bawah sebagai 
# kategori apa. Jika jawaban AI terdaftar maka field category akan diisi dengan
# nilai pertama yaitu "hp".
# Sifatnya wajib.
category = hp, handphone, smartphone

# Hanya tanya ke AI bila sesuai filter. Selain itu akan ditetapkan ke kategori
# "lainnya". Filter ini digunakan oleh DataFrame.query().
# Bila di filter ditemukan "stock > 0" maka downloader.py hanya akan membaca
# yang ada stoknya saja.
# Sifatnya tidak wajib.
filter = stock > 0

# {desc} akan diganti dengan gabungan field title dan description.
# Sifatnya wajib.
prompt_template =
    Berikut ini spesifikasi hardware.

    {desc}

    Jawab pertanyaan berikut dalam bentuk JSON dictionary sesuai nomor urut.

    {columns}


# Nama kolom dan pertanyaan untuk AI. Rangkaian ini akan disematkan di
# {columns} pada prompt_template di atas.
columns =
    category: Apakah ini sebuah handphone, tablet, atau lainnya ? Jawab singkat.
    brand_name: Apa mereknya ? Satu kata saja.
    processor: Kalimat mana yang menunjukkan CPU ?
    processor_name: Apa brand prosesornya ? Satu kata saja.
    graphic: Kalimat mana yang menunjukkan graphic adapter ?
    graphic_name: Apa brand graphic adaptor-nya ? Satu kata saja.
    memory: Kalimat mana yang menunjukkan RAM ?
    memory_gb: RAM berapa gigabyte ? Sebut angka saja.
    storage: Kalimat mana yang menunjukkan kapasitas storage ?
    storage_gb: Storage berapa gigabyte ? Sebut angka saja.
    monitor: Kalimat mana yang menunjukkan ukuran monitor ?
    monitor_inch: Monitornya berapa inchi ? Sebut angka saja.
    usb: Kalimat mana yang menunjukkan jenis USB ?
    is_usb_c: Kalimat mana yang menunjukkan USB type-C ?
    is_compass: Kalimat mana yang menunjukkan sensor kompas ?
    battery: Kalimat mana yang menunjukkan kapasitas baterai ?
    battery_mah: Baterainya berapa mAh ? Sebut angka saja.
    is_nfc: Kalimat mana yang menunjukkan NFC ?
    is_network_5g: Kalimat mana yang menunjukkan network 5G ?
    weight: Kalimat mana yang menunjukkan berat ?
    weight_kg: Beratnya berapa kilogram ? Sebut angka saja.
    camera: Kalimat mana yang menunjukkan fitur kamera ?
    camera_mp: Kameranya berapa mega pixel ? Sebut angka saja.
    camera_aperture: Aperture-nya berapa ? Biasanya tertulis f/n, sebutkan nilai n saja.
    is_camera_ois: Kalimat mana yang menunjukkan Optical Image Stabilization ?


# ---------
# repair.py
# ---------

# Sebuah smartphone wajib memuat informasi processor. Tapi bila Anda ingin
# menyertakan juga feature phone seperti Nokia maka tidak perlu menyertakan
# ini. Bila diwajibkan maka feature phone akan ditetapkan sebagai kategori
# "lainnya".
;not_null_columns =
;    processor

# - Numeric -

# Jika nama kolom berakhiran underscore ( _ ) ditambah numeric unit (contoh:
# memory_gb) maka nilainya akan diuji dengan fungsi float(). Jika gagal maka
# diganti dengan None. 
numeric_units =
    gb
    inch
    mah
    kg
    mp
    aperture


# Jika nilainya di luar batas maka akan dikosongkan
range_values =
    memory_gb:1,128
    storage_gb:16,2048
    monitor_inch:4.7,7
    battery_mah:1,99999
    camera_mp:1,999
    camera_aperture:1,22
    weight_kg:0.1,0.22

# --------
# check.py
# --------

# Daftar kolom yang akan dihitung jumlah produknya:
# SELECT column, count(*) FROM ... GROUP BY 1
count_columns =
    brand_name
    processor_name
    graphic_name
    memory_gb
    storage_gb
    monitor_inch
    battery_mah
    camera_mp
    camera_aperture


# Daftar kolom yang akan dihitung nilai minimum dan maksimumnya:
# SELECT column, min(column), max(column) FROM ... GROUP BY 1
min_max_columns =
    memory_gb
    storage_gb
    weight_kg
    price


# -----
# Name 
# -----

# Nama kolom yang berakhiran "_name" nilainya akan dicek berdasarkan daftar
# ini. Misalkan AI menetapkan brand_name = Iphone maka repair.py mengubahnya
# menjadi Apple. Ia juga peduli huruf kecil dan besar. Jadi bila AI bilang
# brand = INFINIX maka akan diubah menjadi Infinix. Untuk ASUS tidak berubah
# sesuai yang terdaftar.

[brand_name]
